<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabfold Quick Switcher</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="quick.css">
</head>
<body class="quick">
  <header class="top">
    <button type="button" id="back" class="back" aria-label="Back to groups" title="Back to groups (←)" hidden>←</button>
    <div class="brand"><img src="icons/icon-32.png" alt="" width="22" height="22"><span id="heading">Tabfold — Quick Switcher</span></div>
    <span id="count" class="count"></span>
  </header>

  <main>
    <ul id="results" role="listbox" aria-label="Groups" tabindex="0"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer id="foot"><span id="hints"></span></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="quick.js"></script>
</body>
</html>
